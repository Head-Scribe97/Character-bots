<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Character Bot Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Character Bot Dashboard</span>
      <div>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('index') }}">Characters</a>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('settings') }}">Settings</a>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Log out</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
