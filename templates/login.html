<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Log in — Character Bot Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height:100vh">
  <div class="container" style="max-width:360px">
    <h3 class="mb-3">Character Bot Dashboard</h3>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
      <input class="form-control mb-3" type="password" name="password" placeholder="Password" autofocus>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
  </div>
</body>
</html>
